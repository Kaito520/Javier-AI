<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fff6f2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Javier AI</title>
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
</head>
<body>
<div class="app">

  <!-- PANTALLA DE INICIO -->
  <section id="intro-screen" class="screen intro-screen">
    <div class="intro-decor" aria-hidden="true">
      <svg viewBox="0 0 120 160" class="tulip-svg">
        <path d="M60 160 V70" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M60 110 C40 105 35 120 45 130" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M60 100 C80 95 85 112 73 122" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M60 70 C40 70 32 50 40 30 C46 40 52 44 60 46 C68 44 74 40 80 30 C88 50 80 70 60 70 Z" fill="currentColor"/>
      </svg>
    </div>

    <div class="intro-card">
      <p class="intro-text">
        Bueno...<br /><br />
        aparentemente hice algo bastante extraño.<br /><br />
        Ahora existe una pequeña versión digital de mí para que puedas hablar conmigo cuando quieras.<br /><br />
        No prometo tener todas las respuestas.<br /><br />
        Pero hice lo posible para que se parezca un poquito a mí.
      </p>
      <button id="start-btn" class="btn-primary" type="button">Hablar conmigo</button>
    </div>
  </section>

  <!-- PANTALLA DE CHAT -->
  <section id="chat-screen" class="screen chat-screen hidden">
    <div class="chat-layout">

      <aside class="companion-panel">
        <div class="chibi-stage" aria-hidden="true"></div>
        <div class="chibi-wrap">
          <img id="chibi-base" class="chibi-frame" src="/assets/chibi-neutral.png" alt="Javier" />
          <img id="chibi-top" class="chibi-frame" src="/assets/chibi-neutral.png" alt="" />
        </div>
        <h1 class="app-title">Javier AI</h1>
      </aside>

      <div class="chat-panel">
        <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversación"></div>

        <div id="typing-indicator" class="typing-indicator hidden" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>

        <p id="input-error" class="input-error hidden" role="alert"></p>

        <form id="chat-form" class="chat-input-row">
          <input
            id="chat-input"
            type="text"
            maxlength="2000"
            autocomplete="off"
            placeholder="Escribile algo a Javier..."
            aria-label="Escribí tu mensaje"
          />
          <button id="send-btn" class="btn-send" type="submit">Enviar</button>
        </form>
      </div>

    </div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
